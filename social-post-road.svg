<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3B4E"/>
      <stop offset="60%" stop-color="#1F2A38"/>
      <stop offset="100%" stop-color="#141C27"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#sky2)"/>

  <!-- top label bar -->
  <rect x="0" y="0" width="1080" height="8" fill="#E8A33D"/>

