  <!-- illustration: road + hills bottom -->
  <path d="M0 760 Q 260 700 540 745 T 1080 730 V 1080 H 0 Z" fill="#4C6B3D" opacity="0.55"/>
  <path d="M0 820 Q 300 780 600 810 T 1080 795 V 1080 H 0 Z" fill="#4C6B3D" opacity="0.9"/>
  <path d="M380 1080 L 470 830 L 610 830 L 700 1080 Z" fill="#B65C38"/>
