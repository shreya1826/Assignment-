  <text x="70" y="290" font-family="Baloo 2, Noto Sans Devanagari, Arial, sans-serif" font-size="46" fill="#FFFFFF" font-weight="700">बड़ी उपलब्धि</text>

  <!-- big stat -->
  <text x="70" y="470" font-family="Baloo 2, Noto Sans Devanagari, Arial, sans-serif" font-size="150" fill="#E8A33D" font-weight="800">18 किमी</text>
