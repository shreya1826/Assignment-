<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#B65C38"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="#F6EFE1"/>
  <rect x="0" y="0" width="1080" height="360" fill="url(#sky3)"/>

  <text x="70" y="90" font-family="Noto Sans Devanagari, Arial, sans-serif" font-size="22" fill="#141C27" font-weight="600" opacity="0.85">सूर्यपुरा ग्राम विकास पोर्टल</text>

  <text x="70" y="220" font-family="Baloo 2, Noto Sans Devanagari, Arial, sans-serif" font-size="52" fill="#141C27" font-weight="800">अपनी डिजिटल पहचान</text>
  <text x="70" y="290" font-family="Baloo 2, Noto Sans Devanagari, Arial, sans-serif" font-size="52" fill="#141C27" font-weight="800">आज ही बनाएं</text>

  <!-- network icon -->
  <g transform="translate(500,540)" stroke="#B65C38" stroke-width="3" opacity="0.9">
    <circle cx="0" cy="0" r="10" fill="#B65C38"/>
    <circle cx="-140" cy="-110" r="8" fill="#4C6B3D"/>
    <circle cx="150" cy="-100" r="8" fill="#4C6B3D"/>
    <circle cx="-150" cy="120" r="8" fill="#4C6B3D"/>
    <circle cx="160" cy="115" r="8" fill="#4C6B3D"/>
    <line x1="0" y1="0" x2="-140" y2="-110"/>
    <line x1="0" y1="0" x2="150" y2="-100"/>
    <line x1="0" y1="0" x2="-150" y2="120"/>
    <line x1="0" y1="0" x2="160" y2="115"/>
  </g>

  <text x="70" y="800" font-family="Noto Sans Devanagari, Arial, sans-serif" font-size="24" fill="#2B2620" opacity="0.8">पंचायत की हर योजना, हर सेवा —</text>
  <text x="70" y="838" font-family="Noto Sans Devanagari, Arial, sans-serif" font-size="24" fill="#2B2620" opacity="0.8">अब एक क्लिक दूर।</text>

  <!-- CTA -->
  <rect x="70" y="900" width="330" height="70" rx="3" fill="#141C27"/>
  <text x="100" y="945" font-family="Noto Sans Devanagari, Arial, sans-serif" font-size="22" fill="#F6EFE1" font-weight="600">अभी पंजीकरण करें</text>

  <text x="70" y="1030" font-family="Noto Sans Devanagari, Arial, sans-serif" font-size="16" fill="#6a6154">केवल 5 मिनट में पूरी प्रक्रिया</text>
</svg>
