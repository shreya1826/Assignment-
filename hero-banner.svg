<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3B4E"/>
      <stop offset="55%" stop-color="#1F2A38"/>
      <stop offset="100%" stop-color="#141C27"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4C577" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F4C577" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="628" fill="url(#sky)"/>

  <!-- sun + glow -->
  <circle cx="880" cy="300" r="220" fill="url(#sunglow)"/>
  <circle cx="880" cy="300" r="120" fill="#E8A33D"/>
  <g stroke="#F4C577" stroke-width="2.5" opacity="0.55">
    <line x1="880" y1="150" x2="880" y2="115"/>
    <line x1="990" y1="195" x2="1015" y2="172"/>
    <line x1="770" y1="195" x2="745" y2="172"/>
  </g>

  <!-- distant hills -->
  <path d="M0 430 Q 260 370 520 415 T 1200 400 V 628 H 0 Z" fill="#4C6B3D" opacity="0.5"/>
  <path d="M0 470 Q 300 430 600 460 T 1200 445 V 628 H 0 Z" fill="#4C6B3D" opacity="0.85"/>

  <!-- village silhouette on right, behind sun base -->
  <g fill="#141C27">
    <rect x="760" y="470" width="60" height="55"/>
    <polygon points="748,470 790,438 832,470"/>
    <rect x="850" y="490" width="46" height="38"/>
    <polygon points="840,490 873,466 906,490"/>
    <rect x="960" y="480" width="55" height="48"/>
    <polygon points="948,480 987,452 1026,480"/>
  </g>

  <!-- road curving from left foreground -->
  <path d="M0 628 L 340 480 L 420 480 L 300 628 Z" fill="#B65C38"/>
  <path d="M370 480 L 320 628" stroke="#F6EFE1" stroke-width="4" stroke-dasharray="12 12" opacity="0.55"/>

  <!-- network/digital dots motif -->
  <g stroke="#F4C577" stroke-width="1.6" opacity="0.7">
    <circle cx="470" cy="410" r="4" fill="#F4C577"/>
    <circle cx="560" cy="380" r="4" fill="#F4C577"/>
    <circle cx="650" cy="405" r="4" fill="#F4C577"/>
    <line x1="470" y1="410" x2="560" y2="380"/>
    <line x1="560" y1="380" x2="650" y2="405"/>
  </g>

  <!-- text panel -->
  <text x="70" y="230" font-family="Baloo 2, Noto Sans Devanagari, Arial, sans-serif" font-size="20" fill="#F4C577" font-weight="600">ग्राम पंचायत सूर्यपुरा · डिजिटल विकास पहल</text>
  <text x="70" y="300" font-family="Baloo 2, Noto Sans Devanagari, Arial, sans-serif" font-size="58" fill="#FFFFFF" font-weight="700">हर घर तक पहुँचे,</text>
  <text x="70" y="365" font-family="Baloo 2, Noto Sans Devanagari, Arial, sans-serif" font-size="58" fill="#E8A33D" font-weight="700">विकास की रोशनी</text>
  <text x="70" y="415" font-family="Noto Sans Devanagari, Arial, sans-serif" font-size="20" fill="#F6EFE1" opacity="0.82">शिक्षा · किसान · सड़क · पंचायत · डिजिटल पहचान</text>

  <!-- CTA chip -->
  <rect x="70" y="450" width="230" height="52" rx="3" fill="#E8A33D"/>
  <text x="90" y="484" font-family="Noto Sans Devanagari, Arial, sans-serif" font-size="19" fill="#141C27" font-weight="600">सूर्यपुरा पोर्टल देखें</text>
</svg>
